[project]
name = "ai-based-intelligent-document-processing-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SumeethK28", email = "sumeethk2814@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.2",
    "groq>=1.7.0",
    "langgraph>=1.2.14",
    "onnxruntime>=1.30.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.0.0",
    "pydantic>=2.14.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "rapidocr>=3.9.2",
    "reportlab>=5.0.1",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "idp"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
